name: CI (macOS arm64 and Linux x86-64; CPU-only MLX tests, Metal build-only)

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # the pinned pair (scripts/build_mlx_deps.sh); a new tag is a new cache key
  MLX_REF: v0.32.4
  MLXC_REF: v0.8.0

jobs:
  # The hosted runners are virtual machines and open no Metal device, where a Metal build of MLX cannot allocate on
  # either device. MLX built from source without Metal allocates on the CPU device, so these jobs run every device
  # test on the CPU (the GPU-only checks skip) and the installed-consumer check. scripts/ci_cpu_job.sh is the whole
  # job; the steps before it only provide the toolchain and the cached CPU-only MLX.
  cpu:
    name: CPU-only MLX, ${{ matrix.build }}, ${{ matrix.compiler }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        compiler: [gfortran-15, gfortran-16]
        include:
          - compiler: gfortran-15
            formula: gcc@15
          - compiler: gfortran-16
            formula: gcc
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install ${{ matrix.formula }} cmake pkgconf
          brew list --versions ${{ matrix.formula }} cmake pkgconf
          ${{ matrix.compiler }} --version | head -n 1

      - name: Cache the CPU-only MLX
        id: mlx-cache
        uses: actions/cache@v4
        with:
          path: .deps/install-cpu
          key: mlx-cpu-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.MLX_REF }}-${{ env.MLXC_REF }}-${{ hashFiles('scripts/build_mlx_deps.sh') }}

      - name: Clone MLX and mlx-c at the pinned tags
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MLX_REF" https://github.com/ml-explore/mlx.git "$RUNNER_TEMP/mlx"
          git clone --depth 1 --branch "$MLXC_REF" https://github.com/ml-explore/mlx-c.git "$RUNNER_TEMP/mlx-c"

      - name: CPU-only job (scripts/ci_cpu_job.sh)
        env:
          MLX_SRC: ${{ runner.temp }}/mlx
          MLXC_SRC: ${{ runner.temp }}/mlx-c
        run: scripts/ci_cpu_job.sh ${{ matrix.build }} ${{ matrix.compiler }}

  # Linux has no Metal: scripts/build_mlx_deps.sh builds MLX CPU-only there, with GCC and the system's OpenBLAS (BLAS,
  # LAPACK) and LAPACKE's headers, and every device test runs on the CPU, as in the jobs above.
  # scripts/ci_linux_job.sh is the whole job (scripts/ci_cpu_job.sh, then the library inside a parent project and the
  # toys without MLX); the steps before it only provide the toolchain and the cached CPU-only MLX. GNU Fortran 14 is
  # Ubuntu 24.04's, 15 comes from the toolchain PPA; the runner's own CMake, Python and g++ (MLX's build, and its CPU
  # backend's kernels of compiled graphs at run time) serve as they are.
  linux:
    name: Linux CPU-only MLX, ${{ matrix.build }}, ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        compiler: [gfortran-14, gfortran-15]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          if [ "${{ matrix.compiler }}" = gfortran-15 ]; then sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; fi
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.compiler }} pkg-config libopenblas-openmp-dev liblapacke-dev
          ${{ matrix.compiler }} --version | head -n 1
          cmake --version | head -n 1
          g++ --version | head -n 1

      - name: Cache the CPU-only MLX
        id: mlx-cache
        uses: actions/cache@v4
        with:
          path: .deps/install-cpu
          key: mlx-cpu-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ env.ImageVersion }}-${{ env.MLX_REF }}-${{ env.MLXC_REF }}-${{ hashFiles('scripts/build_mlx_deps.sh') }}

      - name: Clone MLX and mlx-c at the pinned tags
        if: steps.mlx-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MLX_REF" https://github.com/ml-explore/mlx.git "$RUNNER_TEMP/mlx"
          git clone --depth 1 --branch "$MLXC_REF" https://github.com/ml-explore/mlx-c.git "$RUNNER_TEMP/mlx-c"

      - name: Linux job (scripts/ci_linux_job.sh)
        env:
          MLX_SRC: ${{ runner.temp }}/mlx
          MLXC_SRC: ${{ runner.temp }}/mlx-c
        run: scripts/ci_linux_job.sh ${{ matrix.build }} ${{ matrix.compiler }}

  # Homebrew's mlx is a Metal build: here it only builds, with warnings as errors, and runs the source checks; its
  # device tests skip. Neither these jobs nor the CPU-only ones gate a release: that is scripts/release_gate.sh on
  # an Apple-silicon Mac, which fails on any skip and runs the installed consumer on the GPU.
  metal-build:
    name: Metal build-only, ${{ matrix.build }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install gcc cmake mlx-c
          brew list --versions gcc cmake mlx mlx-c

      - name: Build, fast gate, install
        env:
          MLXF_CMAKE_ARGS: -DMLXF_REQUIRE_GPU=OFF -DMLXF_WERROR=ON -DFORTLS=OFF
        run: |
          if [ "${{ matrix.build }}" = debug ]; then ./compile_debug.sh; else ./compile_clean.sh; fi

      - name: Report device availability and skipped tests
        if: always()
        run: |
          T=build/Testing/Temporary/LastTest.log
          nskip=0
          [ -f "$T" ] && nskip=$(grep -c 'SKIP' "$T" || true)
          grep -h -m 1 -E 'GPU devices' "$T" || true
          {
            echo "### ${{ matrix.build }}: Metal build-only run"
            echo ""
            echo "Tests that reported a skip for lack of a Metal device: **${nskip}**."
            echo "The CPU-only jobs run the device tests on the CPU; releases need scripts/release_gate.sh on Apple silicon."
          } >> "$GITHUB_STEP_SUMMARY"
