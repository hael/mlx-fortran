name: Build-only CI (macOS, no Metal device)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build }} build (device tests skip)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install gcc cmake mlx-c
          brew list --versions gcc cmake mlx mlx-c

      # The runners are virtual machines and open no Metal device; a Metal build of MLX then cannot allocate
      # arrays on either device. The gate's tests that need a device report a skip (MLXF_REQUIRE_GPU=OFF); the
      # build, with warnings as errors, and the source checks run. This job does not gate a release: that is
      # scripts/release_gate.sh on an Apple-silicon Mac, which fails on any skip.
      - name: Build, fast gate, install
        env:
          MLXF_CMAKE_ARGS: -DMLXF_REQUIRE_GPU=OFF -DMLXF_WERROR=ON
        run: |
          if [ "${{ matrix.build }}" = debug ]; then ./compile_debug.sh; else ./compile_clean.sh; fi

      - name: Report device availability and skipped tests
        if: always()
        run: |
          T=build/Testing/Temporary/LastTest.log
          nskip=0
          [ -f "$T" ] && nskip=$(grep -c 'SKIP' "$T" || true)
          grep -h -m 1 -E 'GPU devices' "$T" || true
          {
            echo "### ${{ matrix.build }}: build-only run"
            echo ""
            echo "Tests that reported a skip for lack of a Metal device: **${nskip}**."
            echo "A green run here does not cover the device tests; releases need scripts/release_gate.sh on Apple silicon."
          } >> "$GITHUB_STEP_SUMMARY"
