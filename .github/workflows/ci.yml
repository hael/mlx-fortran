name: Build and fast gate (macOS)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.build }} build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install gcc cmake mlx-c

      # The runners are virtual machines and may open no Metal device; a Metal build of MLX then cannot
      # allocate arrays on either device. The gate's tests that need a device report a skip there
      # (MLXF_REQUIRE_GPU=OFF); the build, with warnings as errors, and the source checks run.
      - name: Build, fast gate, install
        env:
          MLXF_CMAKE_ARGS: -DMLXF_REQUIRE_GPU=OFF -DMLXF_WERROR=ON
        run: |
          if [ "${{ matrix.build }}" = debug ]; then ./compile_debug.sh; else ./compile_clean.sh; fi
